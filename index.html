            <li><a href="mailto:diego.alarcondiaz@gmail.com" class="flex items-center gap-2 p-2 md:p-3 text-teal-400 rounded-md hover:bg-gray-700 transition-colors duration-300"><i class="fa-solid fa-envelope text-base md:text-lg"></i></a></li>
            <!-- Link to Calendly section -->
            <li><a href="#schedule-meeting" class="flex items-center gap-2 p-2 md:p-3 text-teal-400 rounded-md hover:bg-gray-700 transition-colors duration-300"><i class="fa-solid fa-calendar-days text-base md:text-lg"></i></a></li>
        </ul>
    </nav>

    <!-- Fixed Calendly Button (corner) -->
    <a href="#" id="calendly-corner-btn" class="fixed bottom-4 right-4 z-50 flex items-center gap-2 p-3 bg-teal-400 hover:bg-teal-500 text-white rounded-full shadow-lg transition-colors duration-300">

        <!-- Header -->
        <header class="mb-10 text-center sm:text-left">

                    <img src="https://github.com/diegoalarc/diegoalarc.github.io/blob/main/images/foto_diego.jpg?raw=true" alt="Diego Alarcón" id="profile-image">
                </div>
                <div class="flex flex-col items-center sm:items-start">
                    <h1 class="text-4xl sm:text-5xl font-bold highlight-text mb-2">Diego Alarcón</h1>
                    <p class="text-lg text-gray-400" id="profile-description"></p>

        <section id="projects" class="mb-10"></section>

        <!-- Calendly Section at Bottom -->
        <section id="schedule-meeting" class="mb-10 mt-20 p-6 bg-gray-900 rounded-xl shadow-lg text-center">

            <p class="text-gray-300 mb-6">Select a time slot that works for you. / Selecciona un horario que te acomode.</p>
            <a href="#" id="calendly-link" class="inline-flex items-center gap-2 px-6 py-3 text-white bg-teal-400 hover:bg-teal-500 rounded-lg text-lg font-semibold transition-colors duration-300">

                <span class="mx-2">|</span>
                <a href="https://diegoalarc.github.io/" target="_blank" class="hover:text-white transition-colors duration-300">diegoalarc.github.io</a>
            </div>
        </footer>

    <!-- Scripts -->
    <script type="module" src="assets/js/scripts.js"></script>

    <!-- Calendly JS -->
    <script>
        function initCalendlyPopup(elementId) {
            const btn = document.getElementById(elementId);
            if(btn) {
                btn.addEventListener("click", function(e){
                    e.preventDefault();
                    if(typeof Calendly !== "undefined") {
                        Calendly.initPopupWidget({ url: "https://calendly.com/diego-alarcondiaz/30min" });
                    } else {
                        console.error("Calendly script not loaded yet");
                    }
                });
            }
        }
        document.addEventListener("DOMContentLoaded", function(){
            initCalendlyPopup("calendly-link");        // Bottom section button
            initCalendlyPopup("calendly-corner-btn");  // Fixed corner button
        });
    </script>
</body>
</html>
